name: Validar Pull Requests del sistema

on:
  pull_request:
    branches:
      - QA
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

# Si se agrega otro commit al mismo Pull Request,
# cancela la ejecución anterior y comienza nuevamente.
concurrency:
  group: validar-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

  FRONTEND_IMAGE: conectando-frontend:qa-candidate
  BACKEND_IMAGE: conectando-backend:qa-candidate

  FRONTEND_CONTAINER: conectando-frontend-runner
  BACKEND_CONTAINER: conectando-backend-runner

  FRONTEND_PORT: 3000
  BACKEND_PORT: 3001

jobs:
  # ============================================================
  # TRABAJO 1:
  # VALIDAR RAMAS, FRONTEND Y BACKEND
  # ============================================================
  validar-sistema:
    name: Validar frontend y backend

    # Evita ejecutar en tu computadora código enviado desde forks.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

    # Ejecutar en el runner autohospedado DEISY-SISTEMA.
    runs-on:
      - self-hosted
      - windows
      - x64

    timeout-minutes: 25

    steps:
      # --------------------------------------------------------
      # 1. Validar el flujo de ramas
      # --------------------------------------------------------
      - name: Validar ramas permitidas
        shell: powershell
        env:
          RAMA_ORIGEN: ${{ github.head_ref }}
          RAMA_DESTINO: ${{ github.base_ref }}
        run: |
          Write-Host "=========================================="
          Write-Host "Rama de origen: $env:RAMA_ORIGEN"
          Write-Host "Rama de destino: $env:RAMA_DESTINO"
          Write-Host "=========================================="

          # QA solamente acepta Pull Requests desde feature/*
          if ($env:RAMA_DESTINO -eq "QA") {
              if ($env:RAMA_ORIGEN -like "feature/*") {
                  Write-Host "Flujo permitido: $env:RAMA_ORIGEN -> QA"
                  exit 0
              }

              throw "QA solamente acepta Pull Requests desde ramas feature/*."
          }

          # main solamente acepta Pull Requests desde QA
          if ($env:RAMA_DESTINO -eq "main") {
              if ($env:RAMA_ORIGEN -eq "QA") {
                  Write-Host "Flujo permitido: QA -> main"
                  exit 0
              }

              throw "main solamente acepta Pull Requests desde QA."
          }

          throw "El flujo de ramas no está permitido."

      # --------------------------------------------------------
      # 2. Descargar el código del Pull Request
      # --------------------------------------------------------
      - name: Descargar código del Pull Request
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      # --------------------------------------------------------
      # 3. Configurar Node.js
      # --------------------------------------------------------
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # --------------------------------------------------------
      # 4. Mostrar información del runner
      # --------------------------------------------------------
      - name: Mostrar información del runner
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Sistema operativo: $env:RUNNER_OS"
          Write-Host "Arquitectura: $env:RUNNER_ARCH"
          Write-Host "Equipo: $env:COMPUTERNAME"
          Write-Host "Usuario: $env:USERNAME"
          Write-Host "Directorio: $env:GITHUB_WORKSPACE"
          Write-Host "=========================================="

          Write-Host "Cuenta que ejecuta el trabajo:"
          whoami

          Write-Host "Versión de Node:"
          node --version

          Write-Host "Versión de npm:"
          npm --version

      # ========================================================
      # FRONTEND
      # ========================================================

      # --------------------------------------------------------
      # 5. Instalar dependencias del frontend
      # --------------------------------------------------------
      - name: Instalar dependencias del frontend
        working-directory: frontend
        shell: powershell
        run: |
          npm ci

      # --------------------------------------------------------
      # 6. Ejecutar ESLint del frontend
      # --------------------------------------------------------
      - name: Ejecutar ESLint del frontend
        working-directory: frontend
        shell: powershell
        run: |
          npm run lint

      # --------------------------------------------------------
      # 7. Compilar el frontend
      # --------------------------------------------------------
      - name: Compilar frontend
        working-directory: frontend
        shell: powershell
        run: |
          npm run build

      # ========================================================
      # BACKEND
      # ========================================================

      # --------------------------------------------------------
      # 8. Instalar dependencias del backend
      # --------------------------------------------------------
      - name: Instalar dependencias del backend
        working-directory: backend
        shell: powershell
        run: |
          npm ci

      # --------------------------------------------------------
      # 9. Ejecutar ESLint del backend
      # --------------------------------------------------------
      - name: Ejecutar ESLint del backend
        working-directory: backend
        shell: powershell
        run: |
          npm run lint

      # --------------------------------------------------------
      # 10. Ejecutar pruebas del backend si existen
      # --------------------------------------------------------
      - name: Ejecutar pruebas del backend
        working-directory: backend
        shell: powershell
        run: |
          npm run test --if-present

      # --------------------------------------------------------
      # 11. Compilar el backend
      # --------------------------------------------------------
      - name: Compilar backend
        working-directory: backend
        shell: powershell
        run: |
          npm run build


  # ============================================================
  # TRABAJO 2:
  # DOCKERIZAR Y EJECUTAR FRONTEND Y BACKEND
  # ============================================================
  dockerizar-sistema:
    name: Dockerizar frontend y backend

    # Esperar a que la validación anterior termine.
    needs:
      - validar-sistema

    # Ejecutar solamente cuando el primer trabajo sea exitoso.
    if: ${{ needs.validar-sistema.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository }}

    # Ejecutar en el mismo runner DEISY-SISTEMA.
    runs-on:
      - self-hosted
      - windows
      - x64

    timeout-minutes: 30

    steps:
      # --------------------------------------------------------
      # 1. Descargar nuevamente el código
      # --------------------------------------------------------
      - name: Descargar código del Pull Request
        uses: actions/checkout@v7
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      # --------------------------------------------------------
      # 2. Mostrar información del runner
      # --------------------------------------------------------
      - name: Mostrar información del runner
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "Sistema operativo: $env:RUNNER_OS"
          Write-Host "Arquitectura: $env:RUNNER_ARCH"
          Write-Host "Equipo: $env:COMPUTERNAME"
          Write-Host "Usuario: $env:USERNAME"
          Write-Host "=========================================="

          whoami

      # --------------------------------------------------------
      # 3. Comprobar Docker Desktop y Docker Engine
      # --------------------------------------------------------
      - name: Comprobar Docker
        shell: powershell
        run: |
          Write-Host "Buscando Docker:"
          where.exe docker

          if ($LASTEXITCODE -ne 0) {
              throw "Docker no está disponible en el PATH del runner."
          }

          Write-Host "Comprobando Docker Client y Server:"
          docker version

          if ($LASTEXITCODE -ne 0) {
              throw "El runner no puede conectarse con Docker Engine."
          }

          Write-Host "Obteniendo información de Docker:"
          docker info

          if ($LASTEXITCODE -ne 0) {
              throw "No fue posible obtener información de Docker."
          }

      # --------------------------------------------------------
      # 4. Eliminar contenedores anteriores
      # --------------------------------------------------------
      - name: Eliminar contenedores anteriores
        shell: powershell
        run: |
          $contenedores = @(
              $env:FRONTEND_CONTAINER,
              $env:BACKEND_CONTAINER
          )

          foreach ($contenedor in $contenedores) {
              $id = docker ps -aq --filter "name=^/$contenedor$"

              if ($id) {
                  Write-Host "Eliminando contenedor anterior: $contenedor"
                  docker rm -f $contenedor
              }
              else {
                  Write-Host "No existe el contenedor: $contenedor"
              }
          }

          # Evita que Docker marque el paso como error
          # cuando los contenedores todavía no existen.
          exit 0

      # ========================================================
      # CONSTRUIR IMAGEN DEL BACKEND
      # ========================================================

      - name: Construir imagen del backend
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Construyendo imagen: $env:BACKEND_IMAGE"
          Write-Host "=========================================="

          docker build `
            --file "./backend/Dockerfile" `
            --tag $env:BACKEND_IMAGE `
            "./backend"

          if ($LASTEXITCODE -ne 0) {
              throw "No fue posible construir la imagen del backend."
          }

          docker image inspect $env:BACKEND_IMAGE

      # ========================================================
      # CONSTRUIR IMAGEN DEL FRONTEND
      # ========================================================

      - name: Construir imagen del frontend
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Construyendo imagen: $env:FRONTEND_IMAGE"
          Write-Host "=========================================="

          docker build `
            --file "./frontend/Dockerfile" `
            --tag $env:FRONTEND_IMAGE `
            "./frontend"

          if ($LASTEXITCODE -ne 0) {
              throw "No fue posible construir la imagen del frontend."
          }

          docker image inspect $env:FRONTEND_IMAGE

      # ========================================================
      # EJECUTAR CONTENEDOR DEL BACKEND
      # ========================================================

      - name: Ejecutar contenedor del backend
        shell: powershell
        run: |
          Write-Host "Iniciando el backend..."

          docker run `
            --detach `
            --name $env:BACKEND_CONTAINER `
            --publish "127.0.0.1:$($env:BACKEND_PORT):3001" `
            --env PORT=3001 `
            --env FRONTEND_URL=http://127.0.0.1:3000 `
            $env:BACKEND_IMAGE

          if ($LASTEXITCODE -ne 0) {
              throw "No fue posible iniciar el contenedor del backend."
          }

          docker ps --filter "name=$env:BACKEND_CONTAINER"

      # ========================================================
      # EJECUTAR CONTENEDOR DEL FRONTEND
      # ========================================================

      - name: Ejecutar contenedor del frontend
        shell: powershell
        run: |
          Write-Host "Iniciando el frontend..."

          docker run `
            --detach `
            --name $env:FRONTEND_CONTAINER `
            --publish "127.0.0.1:$($env:FRONTEND_PORT):3000" `
            $env:FRONTEND_IMAGE

          if ($LASTEXITCODE -ne 0) {
              throw "No fue posible iniciar el contenedor del frontend."
          }

          docker ps --filter "name=$env:FRONTEND_CONTAINER"

      # ========================================================
      # COMPROBAR EL BACKEND
      # ========================================================

      - name: Comprobar API del backend
        shell: powershell
        run: |
          $url = "http://127.0.0.1:$($env:BACKEND_PORT)/api/health"
          $backendDisponible = $false

          for ($intento = 1; $intento -le 15; $intento++) {
              try {
                  Write-Host "Intento ${intento}: comprobando $url"

                  $respuesta = Invoke-RestMethod `
                    -Uri $url `
                    -TimeoutSec 10

                  if ($respuesta.status -eq "ok") {
                      Write-Host "Backend funcionando correctamente."
                      Write-Host "Servicio: $($respuesta.servicio)"
                      Write-Host "Mensaje: $($respuesta.mensaje)"

                      $backendDisponible = $true
                      break
                  }
              }
              catch {
                  Write-Host "El backend todavía no responde."

                  if ($intento -lt 15) {
                      Start-Sleep -Seconds 3
                  }
              }
          }

          if (-not $backendDisponible) {
              Write-Host "=========================================="
              Write-Host "Logs del backend"
              Write-Host "=========================================="

              docker logs $env:BACKEND_CONTAINER

              throw "Falló la comprobación del backend."
          }

      # ========================================================
      # COMPROBAR EL FRONTEND
      # ========================================================

      - name: Comprobar aplicación frontend
        shell: powershell
        run: |
          $url = "http://127.0.0.1:$($env:FRONTEND_PORT)"
          $frontendDisponible = $false

          for ($intento = 1; $intento -le 15; $intento++) {
              try {
                  Write-Host "Intento ${intento}: comprobando $url"

                  $respuesta = Invoke-WebRequest `
                    -Uri $url `
                    -UseBasicParsing `
                    -TimeoutSec 10

                  Write-Host "Código HTTP: $($respuesta.StatusCode)"

                  if ($respuesta.StatusCode -eq 200) {
                      Write-Host "Frontend funcionando correctamente."

                      $frontendDisponible = $true
                      break
                  }
              }
              catch {
                  Write-Host "El frontend todavía no responde."

                  if ($intento -lt 15) {
                      Start-Sleep -Seconds 3
                  }
              }
          }

          if (-not $frontendDisponible) {
              Write-Host "=========================================="
              Write-Host "Logs del frontend"
              Write-Host "=========================================="

              docker logs $env:FRONTEND_CONTAINER

              throw "Falló la comprobación del frontend."
          }

      # --------------------------------------------------------
      # 9. Mostrar las imágenes creadas
      # --------------------------------------------------------
      - name: Mostrar imágenes Docker creadas
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Imagen del frontend"
          Write-Host "=========================================="

          docker images `
            --filter "reference=$env:FRONTEND_IMAGE"

          Write-Host "=========================================="
          Write-Host "Imagen del backend"
          Write-Host "=========================================="

          docker images `
            --filter "reference=$env:BACKEND_IMAGE"

      # --------------------------------------------------------
      # 10. Mostrar logs cuando falle algún paso
      # --------------------------------------------------------
      - name: Mostrar logs de diagnóstico
        if: ${{ failure() }}
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Logs del frontend"
          Write-Host "=========================================="

          docker logs $env:FRONTEND_CONTAINER 2>$null

          Write-Host "=========================================="
          Write-Host "Logs del backend"
          Write-Host "=========================================="

          docker logs $env:BACKEND_CONTAINER 2>$null

          # Este paso no debe reemplazar el error original.
          exit 0

      # --------------------------------------------------------
      # 11. Eliminar siempre los contenedores temporales
      # --------------------------------------------------------
      - name: Eliminar contenedores temporales
        if: ${{ always() }}
        shell: powershell
        run: |
          Write-Host "Eliminando contenedores temporales..."

          docker rm -f $env:FRONTEND_CONTAINER 2>$null
          docker rm -f $env:BACKEND_CONTAINER 2>$null

          Write-Host "Limpieza terminada."

          # Evita que un contenedor inexistente marque la limpieza
          # como fallida.
          exit 0